<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Flask Web App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        h1 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
        form { margin-top: 15px; display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; }
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 4px 8px; }
    </style>
</head>
<body>
    <h1>Task Manager</h1>

    <ul>
        {% for task in tasks %}
            <li>
                <span>{{ task }}</span>
                <form action="{{ url_for('delete_task', task_id=loop.index0) }}" method="POST" style="margin: 0;">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <form action="/" method="POST">
        <input type="text" name="task" placeholder="Enter new task..." required>
        <button type="submit">Add Task</button>
    </form>
</body>
</html>
